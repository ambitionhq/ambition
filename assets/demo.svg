<text class="l0" x="28" y="64" xml:space="preserve"><tspan fill="#7EE787" class="b">❯ </tspan><tspan fill="#E6E6EE">/ambition fix the crash when users upload a photo over 5 MB</tspan></text>
<text class="l2" x="28" y="116" xml:space="preserve"><tspan fill="#E6E6EE" class="b">Ambition ladder · photo upload crash</tspan></text>
<text class="l3" x="28" y="142" xml:space="preserve"><tspan fill="#8A8A9A">Rung 0   </tspan><tspan fill="#E6E6EE">As asked: fix one crash</tspan></text>
<text class="l4" x="28" y="168" xml:space="preserve"><tspan fill="#8A8A9A">Axes     </tspan><tspan fill="#FF8A4C" class="b">Altitude</tspan><tspan fill="#8A8A9A"> + </tspan><tspan fill="#3DD6C6" class="b">Depth</tspan><tspan fill="#8A8A9A">   it's one instance of a whole class</tspan></text>
<text class="l6" x="28" y="220" xml:space="preserve"><tspan fill="#E6E6EE" class="b">1 Stretch      </tspan><tspan fill="#3DD6C6" class="b">DEPTH     </tspan><tspan fill="#E6E6EE">Failing test first, fix the root cause,</tspan></text>
<text class="l7" x="28" y="246" xml:space="preserve"><tspan fill="#8A8A9A">                         fuzz 1,000 images · judged by: fuzzer clean 60 min</tspan></text>
<text class="l8" x="28" y="272" xml:space="preserve"><tspan fill="#FF8A4C" class="b">2 Bold         </tspan><tspan fill="#FF8A4C" class="b">ALTITUDE  </tspan><tspan fill="#E6E6EE">Fix every crash with this root cause</tspan><tspan fill="#FF8A4C" class="b">   ★ recommended</tspan></text>
<text class="l9" x="28" y="298" xml:space="preserve"><tspan fill="#E6E6EE">                         from the last 90 days, plus a lint rule so it can't return</tspan></text>
<text class="l10" x="28" y="324" xml:space="preserve"><tspan fill="#8A8A9A">                         judged by: crash-free sessions, before vs after</tspan></text>
<text class="l11" x="28" y="350" xml:space="preserve"><tspan fill="#E6E6EE" class="b">3 Audacious    </tspan><tspan fill="#FF8A4C" class="b">ALTITUDE  </tspan><tspan fill="#E6E6EE">Keep the app crash-free without being asked:</tspan></text>
<text class="l12" x="28" y="376" xml:space="preserve"><tspan fill="#8A8A9A">                         reproduce on every OS, open PRs, shadow mode for 2 weeks</tspan></text>
<text class="l14" x="28" y="428" xml:space="preserve"><tspan fill="#E6E6EE" class="b">What it would look like</tspan></text>
<text class="l15" x="28" y="454" xml:space="preserve"><tspan fill="#7EE787" class="b">  PR  </tspan><tspan fill="#E6E6EE">Fix 7 crashes with one root cause (decode before resize)</tspan></text>
<text class="l16" x="28" y="480" xml:space="preserve"><tspan fill="#8A8A9A">      Evidence: 7/7 reproduced → 0/7 after fix · fuzzer clean 60 min</tspan></text>
<text class="l18" x="28" y="532" xml:space="preserve"><tspan fill="#E6E6EE">Upgraded prompt ready. Say </tspan><tspan fill="#FF8A4C" class="b">go</tspan><tspan fill="#E6E6EE"> to run it.</tspan></text>
